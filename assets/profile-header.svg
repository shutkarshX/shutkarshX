  <text x="158" y="232" fill="#8b949e" font-family="monospace" font-size="13">web</text>
  <text x="194" y="232" fill="#484f58" font-family="monospace" font-size="13">/</text>
  <text x="210" y="232" fill="#8b949e" font-family="monospace" font-size="13">systems</text>
  <text x="274" y="232" fill="#484f58" font-family="monospace" font-size="13">/</text>
  <text x="290" y="232" fill="#8b949e" font-family="monospace" font-size="13">automation</text>

  <!-- workspace panel -->
  <g transform="translate(830 54)">
    <rect width="300" height="192" fill="#161b22" stroke="#30363d"/>
    <rect width="300" height="32" fill="#0d1117" stroke="#30363d"/>
    <circle cx="17" cy="16" r="3" fill="#484f58"/>
    <circle cx="29" cy="16" r="3" fill="#484f58"/>
    <circle cx="41" cy="16" r="3" fill="#484f58"/>
    <text x="60" y="20" fill="#8b949e" font-family="monospace" font-size="11">~/shutkarshX</text>

