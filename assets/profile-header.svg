<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <radialGradient id="glow-left" cx="10%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-right" cx="90%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Base background with rounded corners -->
  <rect width="1200" height="200" rx="16" fill="url(#bg)"/>
  <circle cx="100" cy="80" r="260" fill="url(#glow-left)"/>
  <circle cx="1100" cy="120" r="300" fill="url(#glow-right)"/>

  <!-- Left Content -->
  <g transform="translate(64, 56)">
    <!-- Minimalist mono handle -->
    <text x="0" y="0" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1">~/shutkarshX</text>

    <!-- Clean Bold Name -->
    <text x="0" y="48" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Utkarsh Sharma</text>

    <!-- Clean Punchy One-Liner -->
    <text x="0" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400">building web apps, systems &amp; tools</text>
  </g>

  <!-- Sleek Accent Bottom Line -->
  <rect x="64" y="174" width="340" height="2" rx="1" fill="url(#line-grad)"/>
</svg>
