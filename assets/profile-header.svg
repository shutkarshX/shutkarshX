    <path d="M52 54H1180M52 246H1180" opacity="0.55"/>
  </g>

  <!-- active-line marker -->
  <rect x="52" y="54" width="4" height="192" fill="#58a6ff"/>

  <!-- identity -->
  <text x="82" y="108" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="1">UTKARSH</text>
  <text x="82" y="156" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="1">SHARMA</text>
  <text x="84" y="197" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="18">I build software around real problems.</text>

