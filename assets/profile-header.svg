<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#0d1117"/>

  <!-- restrained engineering grid -->
  <g stroke="#161b22" stroke-width="1">
    <path d="M0 74H1200M0 150H1200M0 226H1200"/>
    <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/>
  </g>

  <!-- identity -->
  <rect x="54" y="50" width="4" height="200" fill="#58a6ff"/>
  <text x="82" y="80" fill="#8b949e" font-family="monospace" font-size="11">~/shutkarshX</text>
  <text x="82" y="137" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" letter-spacing="1">UTKARSH</text>
  <text x="82" y="184" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" letter-spacing="1">SHARMA</text>
  <text x="84" y="219" fill="#c9d1d9" font-family="Arial, Helvetica, sans-serif" font-size="16">software • systems • problem solving</text>
  <text x="84" y="244" fill="#58a6ff" font-family="monospace" font-size="11">python   /   full-stack   /   backend   /   automation</text>

  <!-- large, readable system anatomy -->
  <g transform="translate(650 48)">
    <text x="0" y="14" fill="#6e7681" font-family="monospace" font-size="10" letter-spacing="1">SYSTEM ANATOMY</text>

    <!-- flow line -->
    <path d="M48 117H418" stroke="#30363d" stroke-width="2" fill="none"/>
    <g fill="#58a6ff">
      <path d="M132 113L140 117L132 121Z"/>
      <path d="M225 113L233 117L225 121Z"/>
      <path d="M318 113L326 117L318 121Z"/>
    </g>

    <!-- four primary modules -->
    <g fill="#0d1117" stroke="#30363d" stroke-width="1.5">
      <rect x="0" y="80" width="88" height="74" rx="4"/>
      <rect x="93" y="80" width="88" height="74" rx="4"/>
      <rect x="186" y="80" width="88" height="74" rx="4"/>
      <rect x="279" y="80" width="88" height="74" rx="4"/>
    </g>

    <text x="15" y="105" fill="#58a6ff" font-family="monospace" font-size="10">INTERFACE</text>
    <text x="15" y="123" fill="#8b949e" font-family="monospace" font-size="9">React / web</text>
    <text x="15" y="140" fill="#6e7681" font-family="monospace" font-size="8">input</text>

    <text x="108" y="105" fill="#58a6ff" font-family="monospace" font-size="10">BACKEND</text>
    <text x="108" y="123" fill="#8b949e" font-family="monospace" font-size="9">FastAPI</text>
    <text x="108" y="140" fill="#6e7681" font-family="monospace" font-size="8">services</text>

    <text x="201" y="105" fill="#58a6ff" font-family="monospace" font-size="10">LOGIC</text>
    <text x="201" y="123" fill="#8b949e" font-family="monospace" font-size="9">Python</text>
    <text x="201" y="140" fill="#6e7681" font-family="monospace" font-size="8">decisions</text>

    <text x="294" y="105" fill="#58a6ff" font-family="monospace" font-size="10">DATA</text>
    <text x="294" y="123" fill="#8b949e" font-family="monospace" font-size="9">SQLite / SQL</text>
    <text x="294" y="140" fill="#6e7681" font-family="monospace" font-size="8">state</text>

    <!-- engineering loop beneath the architecture -->
    <path d="M18 194H365" stroke="#21262d" stroke-width="1"/>
    <text x="0" y="216" fill="#6e7681" font-family="monospace" font-size="9">BUILD</text>
    <text x="92" y="216" fill="#6e7681" font-family="monospace" font-size="9">TEST</text>
    <text x="181" y="216" fill="#6e7681" font-family="monospace" font-size="9">DEBUG</text>
    <text x="280" y="216" fill="#6e7681" font-family="monospace" font-size="9">SHIP</text>
    <circle cx="365" cy="212" r="3" fill="#58a6ff"/>
  </g>

  <text x="1148" y="274" text-anchor="end" fill="#30363d" font-family="monospace" font-size="9">engineering / 2026</text>
