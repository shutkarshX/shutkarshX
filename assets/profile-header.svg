<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#0d1117"/>

  <!-- quiet structure -->
  <path d="M48 48H1152M48 252H1152" stroke="#21262d" stroke-width="1"/>
  <path d="M48 48V252" stroke="#58a6ff" stroke-width="3"/>

  <!-- name -->
  <text x="82" y="112" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">UTKARSH</text>
  <text x="82" y="164" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">SHARMA</text>

  <!-- one clear statement -->
  <text x="84" y="204" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="17">I build software around real problems.</text>

  <!-- minimal stack line -->
  <text x="84" y="238" fill="#58a6ff" font-family="monospace" font-size="12">PYTHON</text>
  <text x="150" y="238" fill="#484f58" font-family="monospace" font-size="12">·</text>
  <text x="166" y="238" fill="#8b949e" font-family="monospace" font-size="12">WEB</text>
  <text x="207" y="238" fill="#484f58" font-family="monospace" font-size="12">·</text>
  <text x="223" y="238" fill="#8b949e" font-family="monospace" font-size="12">SYSTEMS</text>
  <text x="292" y="238" fill="#484f58" font-family="monospace" font-size="12">·</text>
  <text x="308" y="238" fill="#8b949e" font-family="monospace" font-size="12">AUTOMATION</text>

  <!-- simple terminal, intentionally sparse -->
  <g transform="translate(820 68)">
    <rect width="332" height="164" fill="#161b22" stroke="#30363d"/>
    <rect width="332" height="30" fill="#11161d" stroke="#30363d"/>
    <circle cx="16" cy="15" r="3" fill="#484f58"/>
    <circle cx="28" cy="15" r="3" fill="#484f58"/>
    <circle cx="40" cy="15" r="3" fill="#484f58"/>
    <text x="58" y="19" fill="#8b949e" font-family="monospace" font-size="10">shutkarshX / main</text>

    <text x="20" y="62" fill="#58a6ff" font-family="monospace" font-size="13">$ whoami</text>
    <text x="20" y="82" fill="#f0f6fc" font-family="monospace" font-size="12">builder</text>
    <text x="20" y="112" fill="#58a6ff" font-family="monospace" font-size="13">$ git status</text>
    <text x="20" y="132" fill="#8b949e" font-family="monospace" font-size="12">building · testing · shipping</text>
    <text x="20" y="151" fill="#58a6ff" font-family="monospace" font-size="12">$ _</text>
  </g>

  <text x="1152" y="274" text-anchor="end" fill="#30363d" font-family="monospace" font-size="9">shutkarshX</text>
</svg>
